name: Daily Data Update

on:
  schedule:
    # 每個工作日 (週一至週五) 的下午 2:23 (CST) 執行 (避開整點/半點排程尖峰，且確保證交所盤後資料已出爐)
    # UTC 6:23 = CST 14:23
    - cron: '23 6 * * 1-5'
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Database from Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh release download database-storage --pattern "twse_data.db" --dir data --clobber || echo "Release not found, skipping download"

      - name: Run data reader
        run: |
          mkdir -p data
          python reader.py --days 15 --no-verify --halt-on-fail 100 --prune-years 2

      - name: Upload Database to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create database-storage --title "Database Storage" --notes "存放最新的股票資料庫" || true
          gh release upload database-storage data/twse_data.db --clobber

      - name: Notify Discord
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python discord_notify.py
